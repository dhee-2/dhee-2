<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1f2328" opacity="0.08"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="240" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="240" fill="#ffffff"/>
    <rect width="1200" height="240" fill="url(#dots)"/>
    <rect width="1200" height="240" fill="url(#fade)"/>
    <g>
      <polygon points="980,0 1040,0 900,240 840,240" fill="#FFC400" opacity="0.25"/>
      <polygon points="1060,0 1100,0 960,240 920,240" fill="#FFC400" opacity="0.5"/>
      <polygon points="1130,0 1150,0 1010,240 990,240" fill="#FFC400" opacity="0.9"/>
    </g>
    <rect x="0" y="232" width="1200" height="8" fill="#FFC400"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="239" rx="14" fill="none" stroke="#d0d7de"/>
  <!-- 형광펜처럼 이름 아래 노란 띠 -->
  <rect x="58" y="96" width="552" height="34" rx="4" fill="#FFC400" opacity="0.85"/>
