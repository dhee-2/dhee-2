    <text x="64" y="132" font-size="88" font-weight="900" fill="#111111" letter-spacing="-1">Donghee Lee</text>
  </g>
  <g font-family="Consolas,'SFMono-Regular',Menlo,monospace" font-size="24">
    <text x="68" y="180" fill="#8c959f">$ whoami <tspan fill="#1f2328">dhee-2</tspan><tspan fill="#d4a000" dx="6">█<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
