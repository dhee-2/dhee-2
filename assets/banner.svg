<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" opacity="0.07"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0d1117" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="240" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="240" fill="#0d1117"/>
    <rect width="1200" height="240" fill="url(#dots)"/>
    <rect width="1200" height="240" fill="url(#fade)"/>
    <!-- 오른쪽 장식: 겹친 노란 사선 -->
    <g opacity="0.9">
      <polygon points="980,0 1040,0 900,240 840,240" fill="#FFC400" opacity="0.10"/>
      <polygon points="1060,0 1100,0 960,240 920,240" fill="#FFC400" opacity="0.18"/>
      <polygon points="1130,0 1150,0 1010,240 990,240" fill="#FFC400" opacity="0.35"/>
    </g>
    <rect x="0" y="232" width="1200" height="8" fill="#FFC400"/>
  </g>
  <g font-family="'Segoe UI','Pretendard','Apple SD Gothic Neo',Helvetica,Arial,sans-serif">
    <text x="64" y="132" font-size="88" font-weight="900" fill="#FFC400" letter-spacing="-1">Donghee Lee</text>
  </g>
  <g font-family="Consolas,'SFMono-Regular',Menlo,monospace" font-size="24">
    <text x="68" y="180" fill="#6e7681">$ whoami <tspan fill="#c9d1d9">dhee-2</tspan><tspan fill="#FFC400" dx="6">█<animate attributeName="fill-opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
  </g>
</svg>
